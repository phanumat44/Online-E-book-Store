<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .success-container {
            text-align: center;
            padding: 40px;
        }
        .checkmark-circle {
            width: 80px;
            height: 80px;
            position: relative;
            display: inline-block;
            vertical-align: top;
            margin-bottom: 20px;
        }
        .checkmark-circle .background {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #28a745;
            position: absolute;
        }
        .checkmark-circle .checkmark {
            border-radius: 5px;
        }
        .checkmark-circle .checkmark.draw:after {
            animation-delay: 100ms;
            animation-duration: 1s;
            animation-timing-function: ease;
            animation-name: checkmark;
            transform: scaleX(-1) rotate(135deg);
            animation-fill-mode: forwards;
        }
        .checkmark-circle .checkmark:after {
            opacity: 1;
            height: 40px;
            width: 20px;
            transform-origin: left top;
            border-right: 7px solid white;
            border-top: 7px solid white;
            content: '';
            left: 18px;
            top: 40px;
            position: absolute;
        }
        @keyframes checkmark {
            0% {
                height: 0;
                width: 0;
                opacity: 1;
            }
            20% {
                height: 0;
                width: 20px;
                opacity: 1;
            }
            40% {
                height: 40px;
                width: 20px;
                opacity: 1;
            }
            100% {
                height: 40px;
                width: 20px;
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="success-container">
            <div class="checkmark-circle">
                <div class="background"></div>
                <div class="checkmark draw"></div>
            </div>
            <h1>Payment Successful!</h1>
            <p>Thank you for your purchase. We have received your payment.</p>
            <p id="intent-id" style="font-size: 0.9em; color: #888;"></p>
            <a href="/" style="display: inline-block; margin-top: 20px; text-decoration: none; color: #5469d4; font-weight: bold;">Back to Home</a>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const paymentIntentId = params.get('payment_intent');
        
        if (paymentIntentId) {
            document.getElementById('intent-id').textContent = `Order ID: ${paymentIntentId}`;
        }
    </script>
</body>
</html>
